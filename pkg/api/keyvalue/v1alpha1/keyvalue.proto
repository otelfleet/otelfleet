syntax = "proto3";
package keyvalue.v1alpha1;
option go_package = "github.com/otelfleet/otelfleet/pkg/api/keyvalue/v1alpha1";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

service KeyValueService {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
    rpc List(ListRequest) returns (ListResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc History(GetHistoryRequest) returns (GetHistoryResponse);
    rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message GetHistoryRequest {
    string type_url = 1;
    string key = 2;
    RangeRequest query = 3;
}

message RangeRequest {
    uint64 offset = 1;
    uint64 limit = 2;
}

message GetHistoryResponse {   
    string type_url = 1;
    repeated KeyValueObject objs = 2;
    RangeRequest position = 3;
}

message KeyValueObject {
    uint64 revision = 1;
    bytes hash = 2;
    string type_url = 3;
    // unset for a tombstone (deleted) revision
    google.protobuf.Any obj = 4;
    google.protobuf.Timestamp modified_at = 5;
}

message PutRequest {
    string type_url = 1;
    string key = 2;
    google.protobuf.Any data = 3;
    // expected revision (current + 1); 0 applies unconditionally without a CAS check
    uint64 revision = 4;
}

message PutResponse{
    KeyValueObject object = 1;
}

message GetRequest {
    string type_url = 1;
    string key = 2;
    // 0 means latest
    uint64 revision = 3;
}

message GetResponse{
    string type_url = 1;
    KeyValueObject object = 2;
}

message ListRequest{
    string type_url = 1;
}

message ListResponse{
    string type_url = 1;
    repeated KeyValueObject objects = 2;
}

message ListKeysRequest{
    string type_url = 1;
}

message ListKeysResponse{
    repeated string keys = 1;
}

message DeleteRequest{
    string type_url = 1;
    string key = 2;
}

message DeleteResponse{}


message WatchRequest {
    string type_url = 1;
    string prefix = 2;
}

message WatchEvent {
    oneof eventType {
        KeyValueObject modified = 1;
        string deletedKey = 2;
    }
}